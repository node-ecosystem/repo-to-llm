<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Repository → PDF</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #121212;
      color: #e0e0e0;
    }

    h1 {
      font-size: 1.4rem;
      color: #ffffff;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
      color: #cccccc;
    }

    input[type=text] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      margin-top: 4px;
      background-color: #1e1e1e;
      color: #ffffff;
      border: 1px solid #444;
      border-radius: 4px;
    }

    input[type=text]::placeholder {
      color: #777;
    }

    input[type=text]:focus {
      outline: none;
      border-color: #666;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .checkbox-row input {
      width: auto;
      accent-color: #555;
    }

    .checkbox-row label {
      margin-top: 0;
      font-weight: normal;
    }

    button {
      margin-top: 24px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      background-color: #333;
      color: #ffffff;
      border: 1px solid #555;
      border-radius: 4px;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #444;
    }

    #status {
      color: #aaa;
      margin-top: 16px;
    }
  </style>
</head>

<body>
  <h1>Generator: Repository → PDF</h1>
  <form id="genForm">
    <label>Repository path (absolute path on this machine)
      <input type="text" name="repoPath" placeholder="/home/user/my-project" required>
    </label>

    <label>Ignore file extensions (comma-separated)
      <input type="text" name="ignoreExtensions" placeholder="*.png, *.log, .exe">
    </label>

    <label>Ignore folder names (comma-separated)
      <input type="text" name="ignoreFolders" placeholder="node_modules, .git, dist">
    </label>

    <label>Ignore files/folders starting with (comma-separated)
      <input type="text" name="ignoreStart" placeholder=".env, .pnp">
    </label>

    <label>Ignore files (comma-separated)
      <input type="text" name="ignoreFiles" placeholder=".gitignore, LICENSE">
    </label>

    <div class="checkbox-row">
      <input type="checkbox" name="normalizeWhitespace" id="normalizeWhitespace" checked>
      <label for="normalizeWhitespace">Collapse multiple spaces / newlines into one</label>
    </div>

    <div class="checkbox-row">
      <input type="checkbox" name="removeComments" id="removeComments">
      <label for="removeComments">Remove comments</label>
    </div>

    <button type="submit">Generate PDF</button>
    <p id="status"></p>
  </form>

  <script>
    const form = document.getElementById('genForm')
    const status = document.getElementById('status')

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      status.textContent = 'Generating PDF…'

      const formData = new FormData(form)
      const params = new URLSearchParams()
      for (const [k, v] of formData.entries()) params.append(k, v)

      try {
        const res = await fetch('/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params.toString()
        })

        if (!res.ok) {
          status.textContent = 'Error: ' + (await res.text())
          return
        }

        const blob = await res.blob()
        const url = URL.createObjectURL(blob)
        const a = document.createElement('a')
        a.href = url
        a.download = 'repository.pdf'
        document.body.appendChild(a)
        a.click()
        a.remove()
        status.textContent = 'Done! PDF downloaded.'
      } catch (err) {
        status.textContent = 'Error: ' + err.message
      }
    })
  </script>
</body>

</html>
